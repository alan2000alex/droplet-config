---
- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy journald disk-limit drop-in
  ansible.builtin.template:
    src: journald-override.conf.j2
    dest: /etc/systemd/journald.conf.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart systemd-journald
